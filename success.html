<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Message Sent | Anthony Silvia - UX Designer & Developer</title>
    <meta name="title" content="Message Sent | Anthony Silvia - UX Designer & Developer">
    <meta name="description" content="Thank you for reaching out! Your message has been sent successfully.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        .success-container {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .success-icon {
            font-size: 4rem;
            color: #2ed573;
            margin-bottom: 2rem;
            animation: scaleIn 0.5s ease-out;
        }
        .success-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2ed573;
        }
        .success-message {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .back-button {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: #2ed573;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .back-button:hover {
            background-color: #26ae60;
        }
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Header Component (will be injected via JS) -->
    <header id="main-header"></header>
    
    <!-- Main Content -->
    <div class="page-container">
        <div class="container">
            <div class="success-container">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1 class="success-title">Message Sent!</h1>
                <p class="success-message">
                    Thank you for reaching out! I've received your message and will get back to you as soon as possible.
                </p>
                <a href="contact.html" class="back-button">
                    <i class="fas fa-arrow-left"></i> Back to Contact
                </a>
            </div>
        </div>
    </div>
    
    <!-- Footer (will be populated by footer.js) -->
    <footer></footer>

    <!-- Custom JavaScript -->
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/script.js"></script>
    <script src="js/themeswitcher.js" defer></script>
</body>
</html>
