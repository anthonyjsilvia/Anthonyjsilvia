<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resume - Anthony Silvia, UX Designer & Developer">
    <title>Resume | Anthony Silvia</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/resume.css">
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Header Component (will be injected via JS) -->
    <header id="main-header"></header>
    
    <!-- Main Content -->
    <div class="resume-modern-container">
        <!-- Sidebar -->
        <aside class="resume-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-avatar">
                    <img src="assets/images/me.jpg" alt="Anthony Silvia" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />
                </div>
                <h1 class="sidebar-name">Anthony Silvia</h1>
                <p class="sidebar-title">UX Designer & Developer</p>
            </div>
            <div class="sidebar-section">
                <h2>Contact</h2>
                <ul class="sidebar-contact">
                    <!-- Populate with contact info -->
                </ul>
            </div>
            <div class="sidebar-section">
                <h2>Skills</h2>
                <div id="skills-section" class="skills-container">
                    <!-- Will be populated from JSON -->
                </div>
            </div>
            <div class="sidebar-section">
                <h2>Languages</h2>
                <ul class="sidebar-languages">
                    <!-- Populate with languages -->
                </ul>
            </div>
        </aside>
        <!-- Main Resume Content -->
        <main class="resume-main">
            <div class="page-header">
                <span class="page-subtitle"><i class="fas fa-briefcase"></i> Resume</span>
                <h1 class="page-title">My Professional <span class="highlight">Journey</span></h1>
                <p class="page-description">
                    A summary of my work history, educational background, and professional achievements.
                </p>
            </div>
            <div class="resume-content">
                <!-- Professional Summary -->
                <div id="professional-summary" class="summary-section">
                    <!-- Will be populated from JSON -->
                </div>
                <!-- Experience Timeline -->
                <div class="resume-section">
                    <h2 class="section-title">Professional Experience</h2>
                    <div id="experience-timeline" class="timeline">
                        <!-- Will be populated from JSON -->
                    </div>
                </div>
                <!-- Education Timeline -->
                <div class="resume-section">
                    <h2 class="section-title">Education</h2>
                    <div id="education-timeline" class="timeline">
                        <!-- Will be populated from JSON -->
                    </div>
                </div>
                <!-- Certifications -->
                <div class="resume-section">
                    <h2 class="section-title">Certifications</h2>
                    <div id="certifications-section" class="certifications-container">
                        <!-- Will be populated from JSON -->
                    </div>
                </div>
                <!-- Projects -->
                <div class="resume-section">
                    <h2 class="section-title">Projects</h2>
                    <div id="projects-section" class="projects-container">
                        <!-- Will be populated from JSON -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Floating Print Button -->
    <a href="/print-resume.html" class="floating-print-btn" title="Print Resume">
        <i class="fas fa-print"></i>
    </a>
    <!-- Footer (will be populated by footer.js) -->
    <footer></footer>
    <!-- Custom JavaScript -->
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/script.js"></script>
    <script src="js/resume-loader.js"></script>
    <script src="js/unlock-contact.js"></script>
</body>
</html>
