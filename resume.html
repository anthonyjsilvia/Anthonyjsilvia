<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Resume | Anthony Silvia - UX Designer & Developer</title>
    <meta name="title" content="Resume | Anthony Silvia - UX Designer & Developer">
    <meta name="description" content="Professional resume of Anthony Silvia, a UX Designer & Developer. View my work experience, skills, and professional achievements.">
    <meta name="keywords" content="Anthony Silvia, UX Designer, Developer, Resume, Portfolio, Professional Experience">
    <meta name="author" content="Anthony Silvia">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anthonysilvia.com/resume">
    <meta property="og:title" content="Resume | Anthony Silvia - UX Designer & Developer">
    <meta property="og:description" content="Professional resume of Anthony Silvia, a UX Designer & Developer. View my work experience, skills, and professional achievements.">
    <meta property="og:image" content="https://anthonysilvia.com/assets/images/me.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://anthonysilvia.com/resume">
    <meta property="twitter:title" content="Resume | Anthony Silvia - UX Designer & Developer">
    <meta property="twitter:description" content="Professional resume of Anthony Silvia, a UX Designer & Developer. View my work experience, skills, and professional achievements.">
    <meta property="twitter:image" content="https://anthonysilvia.com/assets/images/me.jpg">
    
    <!-- LinkedIn -->
    <meta property="og:site_name" content="Anthony Silvia's Resume">
    <meta property="og:locale" content="en_US">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/images/me.jpg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/resume.css">
    <style>
        .sidebar-section {
            margin-bottom: 2rem;
        }
        
        .sidebar-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .honors-list, .certifications-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .honors-list li, .certifications-list li {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
            line-height: 1.4;
        }
        
        .honors-list li::before, .certifications-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-color);
        }
        
        .certifications-list li {
            display: flex;
            flex-direction: column;
        }
        
        .certification-name {
            font-weight: 500;
        }
        
        .certification-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }

        /* Experience Timeline Styles */
        .timeline {
            position: relative;
            padding-left: 0;
        }

        .timeline::before {
            display: none;
        }

        .timeline-item {
            margin-bottom: 2rem;
            position: relative;
        }

        .timeline-item::before {
            display: none;
        }

        .company-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .company-logo {
            max-height: 30px;
            max-width: 150px;
            object-fit: contain;
        }

        .company-name {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin: 0;
            display: block !important;
            line-height: 1.2;
        }

        .role h4 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .timeline-date-badge {
            display: inline-block;
            background-color: var(--primary-color-light);
            color: var(--primary-color);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .location {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .role-duties {
            list-style: none;
            padding-left: 1.5rem;
            margin: 0;
        }

        .role-duties li {
            position: relative;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .role-duties li::before {
            content: "•";
            position: absolute;
            left: -1.5rem;
            color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .company-roles {
                margin-left: 0;
                padding-left: 0;
            }
        }

        .resume-content {
            padding: 2rem;
            background-color: var(--white);
            border-radius: 8px;
            box-shadow: none;
            border-left: none;
        }

        .key-strengths-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .key-strengths-list li {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
            line-height: 1.4;
        }
        
        .key-strengths-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Header Component (will be injected via JS) -->
    <header id="main-header"></header>
    
    <!-- Main Content -->
    <div class="resume-modern-container">
        <!-- Sidebar -->
        <aside class="resume-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-avatar">
                    <img src="assets/images/me.jpg" alt="Anthony Silvia" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />
                </div>
                <h1 class="sidebar-name">Anthony Silvia</h1>
                <p class="sidebar-title">UX Designer & Developer</p>
            </div>
            <div class="sidebar-section">
                <h2>Contact</h2>
                <a href="/contact.html" class="contact-btn">
                    <i class="fas fa-envelope"></i> Contact Me
                </a>
            </div>
            <div class="sidebar-section">
                <h2>Skills</h2>
                <div id="skills-section" class="skills-container">
                    <!-- Will be populated from JSON -->
                </div>
            </div>
            <div class="sidebar-section">
                <h2>Key Strengths</h2>
                <div id="key-strengths-section" class="key-strengths-container">
                    <!-- Will be populated from JSON -->
                </div>
            </div>
            <div class="sidebar-section">
                <h2>Languages</h2>
                <ul class="sidebar-languages">
                    <!-- Populate with languages -->
                </ul>
            </div>
            <div class="sidebar-section">
                <h2>Certifications</h2>
                <div id="certifications-section" class="certifications-container">
                    <!-- Will be populated from JSON -->
                </div>
            </div>
            <div class="sidebar-section">
                <h2>Honors & Awards</h2>
                <div id="honors-section" class="honors-container">
                    <!-- Will be populated from JSON -->
                </div>
            </div>
        </aside>
        <!-- Main Resume Content -->
        <main class="resume-main">
            <div class="page-header">
                <span class="page-subtitle"><i class="fas fa-briefcase"></i> Resume</span>
                <h1 class="page-title">My Professional <span class="highlight">Journey</span></h1>
                <p class="page-description">
                    A summary of my work history, educational background, and professional achievements.
                </p>
            </div>
            <div class="resume-content">
                <!-- Professional Summary -->
                <div id="professional-summary" class="summary-section">
                    <!-- Will be populated from JSON -->
                </div>
                <!-- Experience Timeline -->
                <div class="resume-section">
                    <h2 class="section-title">Professional Experience</h2>
                    <div id="experience-timeline" class="timeline">
                        <!-- Will be populated from JSON -->
                    </div>
                </div>
                <!-- Education Timeline -->
                <div class="resume-section">
                    <h2 class="section-title">Education</h2>
                    <div id="education-timeline" class="timeline">
                        <!-- Will be populated from JSON -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Floating Print Button -->
    <a href="/print-resume.html" class="floating-print-btn" title="Print Resume">
        <i class="fas fa-print"></i>
    </a>
    <!-- Footer (will be populated by footer.js) -->
    <footer></footer>
    <!-- Custom JavaScript -->
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/script.js"></script>
    <script src="js/resume-loader.js"></script>
    <script src="js/unlock-contact.js"></script>
    <script src="js/print-button.js"></script>
    <script src="js/themeswitcher.js" defer></script>
</body>
</html>
