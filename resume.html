<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Resume - Anthony Silvia, UX Designer & Developer">
    <title>Resume | Anthony Silvia</title>
    
    <!-- Google Fonts -->

                    A summary of my work history, educational background, and professional achievements.
                </p>
            </div>
            
            <!-- Professional Summary -->
            <div id="professional-summary" class="summary-section">

            <!-- Skills Section -->
            <h2 class="section-title">Skills</h2>

            <!-- Experience Timeline -->

                <!-- Will be populated from JSON -->

            <!-- Education Timeline -->

            <div id="education-timeline" class="timeline">

            </div>
            
            <!-- Certifications -->

                <!-- Will be populated from JSON -->
            </div>
            
            <!-- Projects -->

            <div id="projects-section" class="projects-container">
                <!-- Will be populated from JSON -->
            </div>
            
            <!-- Download Resume Button -->
            <div style="text-align: center; margin-top: 3rem;">
                <a href="#" class="contact-btn" style="display: inline-block; max-width: 250px;">Download Full Resume</a>
            </div>
        </div>
    </div>
    
    <!-- Footer (will be populated by footer.js) -->
    <footer></footer>

    <!-- Custom JavaScript -->
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/script.js"></script>
    <script src="js/resume-loader.js"></script>
</body>
</html>
