<!DOCTYPE html>
<html>
<head>
	<title>404 - Page Not Found</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		:root {
			--primary-color: #007AFF;
			--text-color: #333;
			--text-muted: #666;
			--bg-primary: #f5f5f5;
			--bg-secondary: #ffffff;
			--bg-dark-primary: #1a1a1a;
			--bg-dark-secondary: #2d2d2d;
			--font-primary: 'Manrope', sans-serif;
			--transition-fast: 0.3s ease;
			--sky-color: #87CEEB;
			--ocean-color: #1E90FF;
			--ocean-color-dark: #0066CC;
			--sand-color: #F4A460;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--text-color: #fff;
				--text-muted: #ccc;
				--bg-primary: var(--bg-dark-primary);
				--bg-secondary: var(--bg-dark-secondary);
				--sky-color: #1a1a2e;
				--ocean-color: #16213e;
				--ocean-color-dark: #0f172a;
				--sand-color: #2c1810;
			}
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: var(--font-primary);
			background-color: var(--bg-primary);
			color: var(--text-color);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			transition: background-color var(--transition-fast), color var(--transition-fast);
			overflow: hidden;
		}

		.beach-scene {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
			background: var(--sky-color);
			overflow: hidden;
		}

		.sun {
			position: absolute;
			top: 50px;
			right: 100px;
			width: 80px;
			height: 80px;
			background: #FFD700;
			border-radius: 50%;
			box-shadow: 0 0 50px #FFD700;
			animation: sunFloat 8s ease-in-out infinite;
		}

		.cloud {
			position: absolute;
			background: white;
			border-radius: 50px;
			opacity: 0.8;
		}

		.cloud:nth-child(1) {
			width: 100px;
			height: 40px;
			top: 80px;
			left: 20%;
			animation: cloudFloat 20s linear infinite;
		}

		.cloud:nth-child(2) {
			width: 140px;
			height: 50px;
			top: 120px;
			left: 60%;
			animation: cloudFloat 25s linear infinite;
		}

		.ocean {
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 40%;
			background: linear-gradient(
				to bottom,
				var(--ocean-color) 0%,
				var(--ocean-color-dark) 100%
			);
			overflow: hidden;
			z-index: 0;
		}

		.wave {
			position: absolute;
			width: 200%;
			height: 100%;
			background: var(--ocean-color);
			border-radius: 50%;
			animation: waveMove 8s linear infinite;
		}

		.wave:nth-child(1) {
			top: -20px;
			left: -50%;
			opacity: 0.7;
			animation-duration: 8s;
		}

		.wave:nth-child(2) {
			top: -15px;
			left: -50%;
			opacity: 0.5;
			animation-duration: 10s;
			animation-delay: -2s;
		}

		.wave:nth-child(3) {
			top: -10px;
			left: -50%;
			opacity: 0.3;
			animation-duration: 12s;
			animation-delay: -4s;
		}

		.wave-crash {
			position: absolute;
			bottom: 15%;
			left: 0;
			width: 100%;
			height: 20px;
			background: linear-gradient(
				to bottom,
				transparent 0%,
				rgba(255, 255, 255, 0.8) 50%,
				transparent 100%
			);
			animation: waveCrash 4s ease-in-out infinite;
		}

		.wave-foam {
			position: absolute;
			bottom: 15%;
			left: 0;
			width: 100%;
			height: 10px;
			background: rgba(255, 255, 255, 0.8);
			border-radius: 50%;
			animation: foamMove 4s ease-in-out infinite;
		}

		.wave-foam::before,
		.wave-foam::after {
			content: '';
			position: absolute;
			bottom: 0;
			width: 50%;
			height: 100%;
			background: rgba(255, 255, 255, 0.8);
			border-radius: 50%;
		}

		.wave-foam::before {
			left: -25%;
			animation: foamLeft 4s ease-in-out infinite;
		}

		.wave-foam::after {
			right: -25%;
			animation: foamRight 4s ease-in-out infinite;
		}

		.sand {
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 15%;
			background: var(--sand-color);
			border-radius: 50% 50% 0 0;
			z-index: 1;
		}

		.palm-tree {
			position: absolute;
			bottom: 15%;
			right: 10%;
			width: 100px;
			height: 200px;
			transform-origin: bottom center;
			animation: palmSway 4s ease-in-out infinite;
			z-index: 2;
		}

		.palm-trunk {
			position: absolute;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 20px;
			height: 120px;
			background: #8B4513;
			border-radius: 10px;
			transform-origin: bottom center;
		}

		.palm-trunk::before {
			content: '';
			position: absolute;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 30px;
			height: 20px;
			background: #8B4513;
			border-radius: 50%;
		}

		.palm-leaves {
			position: absolute;
			top: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 200px;
			height: 200px;
		}

		.palm-leaf {
			position: absolute;
			top: 0;
			left: 50%;
			width: 100px;
			height: 40px;
			background: #228B22;
			transform-origin: left center;
			animation: leafSway 4s ease-in-out infinite;
		}

		.palm-leaf:nth-child(1) { transform: translateX(-50%) rotate(-60deg); animation-delay: 0s; }
		.palm-leaf:nth-child(2) { transform: translateX(-50%) rotate(-30deg); animation-delay: 0.2s; }
		.palm-leaf:nth-child(3) { transform: translateX(-50%) rotate(0deg); animation-delay: 0.4s; }
		.palm-leaf:nth-child(4) { transform: translateX(-50%) rotate(30deg); animation-delay: 0.6s; }
		.palm-leaf:nth-child(5) { transform: translateX(-50%) rotate(60deg); animation-delay: 0.8s; }
		.palm-leaf:nth-child(6) { transform: translateX(-50%) rotate(90deg); animation-delay: 1s; }
		.palm-leaf:nth-child(7) { transform: translateX(-50%) rotate(120deg); animation-delay: 1.2s; }
		.palm-leaf:nth-child(8) { transform: translateX(-50%) rotate(150deg); animation-delay: 1.4s; }

		@keyframes sunFloat {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-20px); }
		}

		@keyframes cloudFloat {
			0% { transform: translateX(-100vw); }
			100% { transform: translateX(100vw); }
		}

		@keyframes waveMove {
			0% { transform: translateX(0); }
			100% { transform: translateX(50%); }
		}

		@keyframes waveCrash {
			0%, 100% { transform: translateY(0) scaleY(1); opacity: 0.3; }
			50% { transform: translateY(-5px) scaleY(1.2); opacity: 0.8; }
		}

		@keyframes foamMove {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-3px); }
		}

		@keyframes foamLeft {
			0%, 100% { transform: translateX(0) scale(1); }
			50% { transform: translateX(10px) scale(1.2); }
		}

		@keyframes foamRight {
			0%, 100% { transform: translateX(0) scale(1); }
			50% { transform: translateX(-10px) scale(1.2); }
		}

		@keyframes palmSway {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(5deg); }
		}

		@keyframes leafSway {
			0%, 100% { transform: translateX(-50%) rotate(var(--rotation)); }
			50% { transform: translateX(-50%) rotate(calc(var(--rotation) + 10deg)); }
		}

		.palm-leaf:nth-child(1) { --rotation: -60deg; }
		.palm-leaf:nth-child(2) { --rotation: -30deg; }
		.palm-leaf:nth-child(3) { --rotation: 0deg; }
		.palm-leaf:nth-child(4) { --rotation: 30deg; }
		.palm-leaf:nth-child(5) { --rotation: 60deg; }
		.palm-leaf:nth-child(6) { --rotation: 90deg; }
		.palm-leaf:nth-child(7) { --rotation: 120deg; }
		.palm-leaf:nth-child(8) { --rotation: 150deg; }

		.rock-formation, .rock, .rock-number, .rock-shadow { display: none !important; }

		.sos-404 {
			position: absolute;
			bottom: 2.5%;
			left: 50%;
			transform: translateX(-50%);
			z-index: 2;
			width: 420px;
			height: 90px;
			pointer-events: none;
		}
		.sos-rock {
			position: absolute;
			width: 18px;
			height: 18px;
			background: #6b5437;
			border-radius: 50% 45% 55% 50% / 60% 50% 55% 45%;
			box-shadow: 0 2px 6px rgba(80, 60, 30, 0.22),
						0 4px 10px 2px #3a2a1444,
						inset 2px 2px 8px #fff2,
						inset -2px -2px 8px #3a2a1444;
			opacity: 0.98;
			transition: background 0.3s;
			animation: sosRockWiggle 3s infinite ease-in-out;
		}
		.sos-rock:nth-child(odd) { background: #7a5c3a; }
		.sos-rock:nth-child(even) { background: #4d3922; }
		.sos-rock::after {
			content: '';
			position: absolute;
			bottom: -2px;
			left: 50%;
			transform: translateX(-50%);
			width: 90%;
			height: 7px;
			background: linear-gradient(to bottom, #3a2a1455 60%, transparent 100%);
			border-radius: 50%;
			filter: blur(2.5px);
			opacity: 0.7;
		}
		@keyframes sosRockWiggle {
			0%, 100% { transform: scale(1) rotate(0deg); }
			20% { transform: scale(1.05) rotate(-2deg); }
			50% { transform: scale(0.97) rotate(2deg); }
			80% { transform: scale(1.03) rotate(-1deg); }
		}
		@media (prefers-color-scheme: dark) {
			.sos-rock { background: #bfa06a; }
			.sos-rock:nth-child(odd) { background: #e2c290; }
			.sos-rock:nth-child(even) { background: #a88b5a; }
		}
		.back-home-btn {
			position: fixed;
			top: 32px;
			left: 32px;
			z-index: 100;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.8rem 1.5rem;
			border-radius: 8px;
			background: var(--primary-color);
			color: #fff;
			border: 2px solid var(--primary-color);
			font-weight: 500;
			font-size: 1rem;
			text-decoration: none;
			box-shadow: 0 2px 8px rgba(0,0,0,0.08);
			transition: all 0.3s ease;
		}
		.back-home-btn i {
			font-size: 1.2rem;
			margin-right: 0.5rem;
		}
		.back-home-btn:hover, .back-home-btn:focus {
			background: #fff;
			color: var(--primary-color);
			outline: none;
			box-shadow: 0 4px 15px rgba(0,0,0,0.12);
		}
		.back-home-btn:active {
			transform: translateY(1px);
		}
		@media (max-width: 600px) {
			.back-home-btn {
				top: 16px;
				left: 8px;
				padding: 0.6rem 1rem;
				font-size: 0.95rem;
			}
		}
		.cloud-text {
			position: absolute;
			top: 90px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 3;
			font-family: var(--font-primary);
			font-size: 2.2rem;
			color: #888;
			text-shadow:
				0 2px 8px #fff,
				0 0 24px #fff,
				0 0 40px #b3e0ff,
				2px 2px 0 #b3e0ff44;
			letter-spacing: 0.04em;
			font-weight: 700;
			opacity: 0.92;
			filter: blur(0.2px) drop-shadow(0 2px 8px #fff8);
			pointer-events: none;
			white-space: nowrap;
			animation: cloudTextFloat 8s ease-in-out infinite;
		}
		@keyframes cloudTextFloat {
			0%, 100% { transform: translateX(-50%) translateY(0); }
			50% { transform: translateX(-50%) translateY(-10px); }
		}
		@media (max-width: 600px) {
			.cloud-text {
				font-size: 1.2rem;
				top: 60px;
			}
		}
	</style>
</head>
<body>
	<a href="/" class="back-home-btn" aria-label="Back to homepage">
		<i class="fas fa-chevron-left" aria-hidden="true"></i>
		Back to Homepage
	</a>
	<div class="beach-scene">
		<div class="sun"></div>
		<div class="cloud"></div>
		<div class="cloud"></div>
		<div class="cloud-text">The URL does not exist</div>
		<div class="ocean">
			<div class="wave"></div>
			<div class="wave"></div>
			<div class="wave"></div>
			<div class="wave-crash"></div>
			<div class="wave-foam"></div>
		</div>
		<div class="sand"></div>
		<div class="sos-404">
			<!-- 4 -->
			<div class="sos-rock" style="top:60px; left:10px;"></div>
			<div class="sos-rock" style="top:40px; left:30px;"></div>
			<div class="sos-rock" style="top:20px; left:50px;"></div>
			<div class="sos-rock" style="top:0px; left:70px;"></div>
			<div class="sos-rock" style="top:40px; left:70px;"></div>
			<div class="sos-rock" style="top:60px; left:70px;"></div>
			<div class="sos-rock" style="top:60px; left:50px;"></div>
			<div class="sos-rock" style="top:60px; left:30px;"></div>
			<!-- 0 -->
			<div class="sos-rock" style="top:20px; left:120px;"></div>
			<div class="sos-rock" style="top:0px; left:140px;"></div>
			<div class="sos-rock" style="top:0px; left:180px;"></div>
			<div class="sos-rock" style="top:20px; left:200px;"></div>
			<div class="sos-rock" style="top:60px; left:120px;"></div>
			<div class="sos-rock" style="top:80px; left:140px;"></div>
			<div class="sos-rock" style="top:80px; left:180px;"></div>
			<div class="sos-rock" style="top:60px; left:200px;"></div>
			<!-- 4 -->
			<div class="sos-rock" style="top:60px; left:250px;"></div>
			<div class="sos-rock" style="top:40px; left:270px;"></div>
			<div class="sos-rock" style="top:20px; left:290px;"></div>
			<div class="sos-rock" style="top:0px; left:310px;"></div>
			<div class="sos-rock" style="top:40px; left:310px;"></div>
			<div class="sos-rock" style="top:60px; left:310px;"></div>
			<div class="sos-rock" style="top:60px; left:290px;"></div>
			<div class="sos-rock" style="top:60px; left:270px;"></div>
		</div>
		<div class="palm-tree">
			<div class="palm-trunk"></div>
			<div class="palm-leaves">
				<div class="palm-leaf"></div>
				<div class="palm-leaf"></div>
				<div class="palm-leaf"></div>
				<div class="palm-leaf"></div>
				<div class="palm-leaf"></div>
				<div class="palm-leaf"></div>
				<div class="palm-leaf"></div>
				<div class="palm-leaf"></div>
			</div>
		</div>
	</div>
</body>
</html>
