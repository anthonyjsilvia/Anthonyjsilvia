<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Contact | Anthony Silvia - UX Designer & Developer</title>
    <meta name="title" content="Contact | Anthony Silvia - UX Designer & Developer">
    <meta name="description" content="Get in touch with Anthony Silvia for UX design and development projects. Based in Charlotte Metro, NC. Let's collaborate on your next project!">
    <meta name="keywords" content="Anthony Silvia, Contact, UX Designer, Developer, Charlotte, Collaboration, Project Inquiry">
    <meta name="author" content="Anthony Silvia">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anthonysilvia.com/contact">
    <meta property="og:title" content="Contact | Anthony Silvia - UX Designer & Developer">
    <meta property="og:description" content="Get in touch with Anthony Silvia for UX design and development projects. Based in Charlotte Metro, NC. Let's collaborate on your next project!">
    <meta property="og:image" content="https://anthonysilvia.com/assets/images/me.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://anthonysilvia.com/contact">
    <meta property="twitter:title" content="Contact | Anthony Silvia - UX Designer & Developer">
    <meta property="twitter:description" content="Get in touch with Anthony Silvia for UX design and development projects. Based in Charlotte Metro, NC. Let's collaborate on your next project!">
    <meta property="twitter:image" content="https://anthonysilvia.com/assets/images/me.jpg">
    
    <!-- LinkedIn -->
    <meta property="og:site_name" content="ContactAnthony Silvia">
    <meta property="og:locale" content="en_US">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        .success-message {
            background-color: rgba(46, 213, 115, 0.1);
            color: #2ed573;
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Header Component (will be injected via JS) -->
    <header id="main-header"></header>
    
    <!-- Main Content -->
    <div class="page-container">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <span class="page-subtitle"><i class="fas fa-envelope"></i> Contact</span>
                <h1 class="page-title">Get In <span class="highlight">Touch</span></h1>
                <p class="page-description">
                    Have a project in mind or want to collaborate? Feel free to reach out!
                </p>
            </div>
            
            <!-- Contact Content -->
            <div class="contact-container">
                <!-- Contact Information -->
                <div class="contact-info">
                    <a href="https://www.google.com/maps/place/Charlotte,+NC" target="_blank" class="contact-item">
                        <div class="contact-icon">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div class="contact-details">
                            <h3>Location</h3>
                            <p>Based in Charlotte Metro, NC</p>
                        </div>
                    </a>
                    
                    <a href="https://linkedin.com/in/anthonyjsilvia" target="_blank" class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-linkedin"></i>
                        </div>
                        <div class="contact-details">
                            <h3>LinkedIn</h3>
                            <p>linkedin.com/in/anthonyjsilvia</p>
                        </div>
                    </a>
                    
                    <a href="https://www.behance.net/anthonysilvia" target="_blank" class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-behance"></i>
                        </div>
                        <div class="contact-details">
                            <h3>Behance</h3>
                            <p>behance.net/anthonysilvia</p>
                        </div>
                    </a>
                    
                    <a href="https://github.com/anthonyjsilvia" target="_blank" class="contact-item">
                        <div class="contact-icon">
                            <i class="fab fa-github"></i>
                        </div>
                        <div class="contact-details">
                            <h3>GitHub</h3>
                            <p>github.com/anthonyjsilvia</p>
                        </div>
                    </a>
                </div>
                
                <!-- Contact Form -->
                <div class="contact-form">
                    <form id="contact-form" action="https://formspree.io/f/xnnvnywd" method="POST">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Your Name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Your Email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" name="subject" class="form-control" placeholder="Subject">
                        </div>
                        
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" class="form-control" placeholder="Your Message" required></textarea>
                        </div>
                        
                        <button type="submit" class="submit-btn">
                            <span class="button-text">Send Message</span>
                            <span class="button-loader" style="display: none;">
                                <i class="fas fa-spinner fa-spin"></i>
                            </span>
                        </button>
                    </form>
                    <div id="form-status" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
    
     <!-- Footer (will be populated by footer.js) -->
     <footer></footer>

     <!-- Custom JavaScript -->
     <script src="js/components/header.js"></script>
     <script src="js/components/footer.js"></script>
     <script src="js/script.js"></script>
     <script src="js/themeswitcher.js" defer></script>
     <script>
        document.getElementById('contact-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = this;
            const submitBtn = form.querySelector('.submit-btn');
            const buttonText = submitBtn.querySelector('.button-text');
            const buttonLoader = submitBtn.querySelector('.button-loader');
            const formStatus = document.getElementById('form-status');
            
            // Show loading state
            submitBtn.disabled = true;
            buttonText.style.display = 'none';
            buttonLoader.style.display = 'inline-block';
            formStatus.style.display = 'none';
            
            try {
                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    // Success
                    form.reset();
                    formStatus.innerHTML = '<div class="success-message"><i class="fas fa-check-circle"></i> Message sent successfully! I\'ll get back to you soon.</div>';
                    formStatus.style.display = 'block';
                } else {
                    // Error
                    throw new Error('Form submission failed');
                }
            } catch (error) {
                // Show error message
                formStatus.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Sorry, there was a problem sending your message. Please try again later.</div>';
                formStatus.style.display = 'block';
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                buttonText.style.display = 'inline-block';
                buttonLoader.style.display = 'none';
            }
        });
    </script>
 
 </body>
 </html>
