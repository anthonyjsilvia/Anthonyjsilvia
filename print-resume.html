<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony Silvia - UX Designer Resume</title>
    <style>
        /* Minimalist styling based on example */
        :root {
            --primary: #333333;
            --secondary: #666666;
            --accent: #0056b3;
            --light-accent: #e6f0fa;
            --light-gray: #f5f5f5;
            --white: #FFFFFF;
            --divider: #dddddd;
        }
        
        @media print {
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            .resume-container {
                box-shadow: none;
                margin: 0;
                max-width: 100%;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            color: var(--primary);
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        
        .resume-container {
            display: flex;
            background-color: var(--white);
            margin: 20px auto;
            max-width: 8.5in;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        }
        
        .left-column {
            width: 30%;
            background-color: var(--white);
            padding: 30px 20px;
            border-right: 1px solid var(--divider);
        }
        
        .right-column {
            width: 70%;
            padding: 30px 20px;
        }
        
        /* Header Section */
        .header {
            margin-bottom: 30px;
        }
        
        .name {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: var(--primary);
        }
        
        .title {
            font-size: 16px;
            font-weight: 400;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .contact-item {
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--secondary);
        }
        
        /* Section Styling */
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: var(--primary);
            position: relative;
        }
        
        .section-title::after {
            content: '';
            display: block;
            width: 30px;
            height: 3px;
            background-color: var(--accent);
            margin-top: 5px;
        }
        
        /* Skills styling */
        .skill-category {
            font-weight: 600;
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
            color: var(--primary);
        }
        
        .skills-list {
            margin-bottom: 15px;
            font-size: 13px;
        }
        
        /* Experience styling */
        .job {
            margin-bottom: 20px;
        }
        
        .company {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
        }
        
        .position {
            font-weight: 400;
            font-style: italic;
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 3px;
        }
        
        .period {
            font-size: 12px;
            color: var(--secondary);
            margin-bottom: 8px;
        }
        
        .job-duties {
            padding-left: 15px;
        }
        
        .job-duties li {
            margin-bottom: 5px;
            list-style-type: none;
            position: relative;
            font-size: 13px;
        }
        
        .job-duties li::before {
            content: "•";
            position: absolute;
            left: -15px;
            color: var(--accent);
        }
        
        /* Education */
        .school {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
        }
        
        .degree {
            font-size: 13px;
            margin-bottom: 3px;
            font-style: italic;
        }
        
        .education-details {
            font-size: 12px;
            color: var(--secondary);
        }
        
        /* Projects */
        .project {
            margin-bottom: 15px;
        }
        
        .project-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .project-details {
            padding-left: 15px;
        }
        
        .project-details li {
            margin-bottom: 5px;
            list-style-type: none;
            position: relative;
            font-size: 13px;
        }
        
        .project-details li::before {
            content: "•";
            position: absolute;
            left: -15px;
            color: var(--accent);
        }
        
        /* Chart element for skills visualization */
        .skills-chart {
            margin: 10px 0 20px 0;
        }
        
        .skill-bar {
            height: 5px;
            background-color: var(--divider);
            margin-bottom: 10px;
            position: relative;
            border: 1px solid var(--divider);
        }
        
        .skill-level {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: var(--accent);
            /* Add fallback borders for printing */
            border-right: 1px solid var(--accent);
            box-shadow: 0 0 0 1000px var(--accent) inset;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        .skill-name {
            font-size: 12px;
            margin-bottom: 3px;
        }
        
        .skill-advanced .skill-level { width: 90%; }
        .skill-proficient .skill-level { width: 75%; }
        .skill-intermediate .skill-level { width: 60%; }
        
        /* Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Buttons */
        .button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .action-button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        
        .action-button:hover {
            background-color: #003d7a;
        }
        
        @media print {
            .button-container {
                display: none;
            }
        }
        
        /* Responsive styles for mobile */
        @media (max-width: 768px) {
            .resume-container {
                flex-direction: column;
                margin: 0;
                box-shadow: none;
            }
            
            .left-column, .right-column {
                width: 100%;
                border-right: none;
            }
            
            .left-column {
                border-bottom: 1px solid var(--divider);
            }
            
            .button-container {
                position: static;
                display: flex;
                justify-content: center;
                margin: 20px 0;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loader">
        <div class="loader-spinner"></div>
    </div>
    
    <div class="resume-container" id="resume-container">
        <!-- Content will be loaded dynamically -->
    </div>
    
    <div class="button-container">
        <button class="action-button" onclick="location.href='/resume.html'">Back to Resume</button>
        <button class="action-button" onclick="window.print()">Print Resume</button>
    </div>
    
    <script src="js/unlock-contact.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        function ready(fn) {
            if (window.ContactUnlock) fn();
            else setTimeout(() => ready(fn), 50);
        }
        ready(function() {
            fetch('resume.json')
                .then(r => r.json())
                .then(data => {
                    buildResume(data);
                    document.querySelector('.loader').style.display = 'none';
                });
        });
    });

    function buildResume(data) {
        const container = document.getElementById('resume-container');
        const leftColumn = document.createElement('div');
        leftColumn.className = 'left-column';
        const rightColumn = document.createElement('div');
        rightColumn.className = 'right-column';
        const header = buildHeader(data.personalInfo);
        leftColumn.appendChild(header);
        const skills = buildSkills(data.skills);
        leftColumn.appendChild(skills);
        const education = buildEducation(data.education);
        leftColumn.appendChild(education);
        const certification = buildCertifications(data.certification);
        leftColumn.appendChild(certification);
        const languages = buildLanguages(data.languages);
        leftColumn.appendChild(languages);
        const summary = buildSummary(data.professionalSummary);
        rightColumn.appendChild(summary);
        const experience = buildExperience(data.experience);
        rightColumn.appendChild(experience);
        const projects = buildProjects(data.projects);
        rightColumn.appendChild(projects);
        container.appendChild(leftColumn);
        container.appendChild(rightColumn);
    }
    
    function buildHeader(personalInfo) {
        const header = document.createElement('div');
        header.className = 'header';
        const img = document.createElement('img');
        img.src = 'assets/images/me.jpg';
        img.alt = 'Anthony Silvia';
        img.style.width = '90px';
        img.style.height = '90px';
        img.style.objectFit = 'cover';
        img.style.borderRadius = '50%';
        img.style.display = 'block';
        img.style.margin = '0 auto 18px auto';
        header.appendChild(img);
        const name = document.createElement('h1');
        name.className = 'name';
        name.textContent = personalInfo.name;
        const title = document.createElement('p');
        title.className = 'title';
        title.textContent = personalInfo.title;
        header.appendChild(name);
        header.appendChild(title);
        if (personalInfo.contact) {
            if (window.ContactUnlock && window.ContactUnlock.hasContactCookie && window.ContactUnlock.hasContactCookie()) {
                if (personalInfo.contact.email) {
                    const email = document.createElement('p');
                    email.className = 'contact-item';
                    email.innerHTML = `<i class='fas fa-envelope'></i> <span style='font-style:normal;text-decoration:none;color:inherit;'>${personalInfo.contact.email}</span>`;
                    header.appendChild(email);
                }
                if (personalInfo.contact.phone) {
                    const phone = document.createElement('p');
                    phone.className = 'contact-item';
                    phone.innerHTML = `<i class='fas fa-phone'></i> <span style='font-style:normal;text-decoration:none;color:inherit;'>${personalInfo.contact.phone}</span>`;
                    header.appendChild(phone);
                }
            } else {
                if (personalInfo.contact.email) {
                    const email = document.createElement('p');
                    email.className = 'contact-item';
                    email.innerHTML = `<i class='fas fa-envelope'></i> <button class='unlock-contact-btn' data-type='email' style='background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;'>Unlock Contact Info</button>`;
                    header.appendChild(email);
                }
                if (personalInfo.contact.phone) {
                    const phone = document.createElement('p');
                    phone.className = 'contact-item';
                    phone.innerHTML = `<i class='fas fa-phone'></i> <button class='unlock-contact-btn' data-type='phone' style='background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;'>Unlock Contact Info</button>`;
                    header.appendChild(phone);
                }
            }
            if (personalInfo.contact.website) {
                const website = document.createElement('p');
                website.className = 'contact-item';
                website.innerHTML = `<i class='fas fa-globe'></i> <a href='https://${personalInfo.contact.website}' target='_blank' style='text-decoration:none;color:inherit;'>${personalInfo.contact.website}</a>`;
                header.appendChild(website);
            }
            if (personalInfo.contact.linkedin) {
                const linkedin = document.createElement('p');
                linkedin.className = 'contact-item';
                linkedin.innerHTML = `<i class='fab fa-linkedin'></i> <a href='https://${personalInfo.contact.linkedin}' target='_blank' style='text-decoration:none;color:inherit;'>${personalInfo.contact.linkedin}</a>`;
                header.appendChild(linkedin);
            }
        }
        return header;
    }
    
    function buildSkills(skills) {
        const section = document.createElement('div');
        section.className = 'section';
        
        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = 'Skills';
        section.appendChild(title);
        
        // Design Tools
        if (skills.designTools && skills.designTools.length > 0) {
            const category = document.createElement('span');
            category.className = 'skill-category';
            category.textContent = 'Design Tools';
            section.appendChild(category);
            
            const chart = document.createElement('div');
            chart.className = 'skills-chart';
            
            skills.designTools.forEach(tool => {
                const name = document.createElement('div');
                name.className = 'skill-name';
                name.textContent = tool.name;
                
                const bar = document.createElement('div');
                bar.className = 'skill-bar';
                
                const level = document.createElement('div');
                level.className = 'skill-level';
                level.style.width = `${tool.level}%`;
                
                bar.appendChild(level);
                chart.appendChild(name);
                chart.appendChild(bar);
            });
            
            section.appendChild(chart);
        }
        
        // Research skills
        if (skills.research && skills.research.length > 0) {
            const category = document.createElement('span');
            category.className = 'skill-category';
            category.textContent = 'Research';
            section.appendChild(category);
            
            const list = document.createElement('p');
            list.className = 'skills-list';
            list.textContent = skills.research.join(', ');
            section.appendChild(list);
        }
        
        // Development skills
        if (skills.development && skills.development.length > 0) {
            const category = document.createElement('span');
            category.className = 'skill-category';
            category.textContent = 'Development';
            section.appendChild(category);
            
            const list = document.createElement('p');
            list.className = 'skills-list';
            list.textContent = skills.development.join(', ');
            section.appendChild(list);
        }
        
        // Collaboration skills
        if (skills.collaboration && skills.collaboration.length > 0) {
            const category = document.createElement('span');
            category.className = 'skill-category';
            category.textContent = 'Collaboration';
            section.appendChild(category);
            
            const list = document.createElement('p');
            list.className = 'skills-list';
            list.textContent = skills.collaboration.join(', ');
            section.appendChild(list);
        }
        
        return section;
    }
    
    function buildEducation(education) {
        const section = document.createElement('div');
        section.className = 'section';
        
        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = 'Education';
        section.appendChild(title);
        
        const edu = document.createElement('div');
        edu.className = 'education';
        
        const school = document.createElement('p');
        school.className = 'school';
        school.textContent = education.school;
        edu.appendChild(school);
        
        if (education.degrees && education.degrees.length > 0) {
            education.degrees.forEach(degree => {
                const degreeEl = document.createElement('p');
                degreeEl.className = 'degree';
                degreeEl.textContent = degree;
                edu.appendChild(degreeEl);
            });
        }
        
        const graduationDetails = document.createElement('p');
        graduationDetails.className = 'education-details';
        graduationDetails.textContent = `Graduated ${education.graduation}`;
        edu.appendChild(graduationDetails);
        
        const gpaDetails = document.createElement('p');
        gpaDetails.className = 'education-details';
        gpaDetails.textContent = `GPA: ${education.gpa}`;
        edu.appendChild(gpaDetails);
        
        section.appendChild(edu);
        return section;
    }
    
    function buildCertifications(certifications) {
        const section = document.createElement('div');
        section.className = 'section';
        
        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = 'Certification';
        section.appendChild(title);
        
        if (certifications && certifications.length > 0) {
            const list = document.createElement('p');
            list.className = 'skills-list';
            list.textContent = certifications.join(', ');
            section.appendChild(list);
        }
        
        return section;
    }
    
    function buildLanguages(languages) {
        const section = document.createElement('div');
        section.className = 'section';

        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = 'Languages';
        section.appendChild(title);

        if (languages && languages.length > 0) {
            const list = document.createElement('ul');
            list.style.listStyle = 'none';
            list.style.padding = '0';
            languages.forEach(lang => {
                const li = document.createElement('li');
                li.style.marginBottom = '7px';
                li.style.fontSize = '13px';
                li.innerHTML = `${lang.name} <span style="background:var(--light-accent);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:11px;margin-left:8px;vertical-align:middle;">${lang.level}</span>`;
                list.appendChild(li);
            });
            section.appendChild(list);
        }
        return section;
    }
    
    function buildSummary(summary) {
        const section = document.createElement('div');
        section.className = 'section';
        
        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = 'Professional Summary';
        section.appendChild(title);
        
        const summaryText = document.createElement('p');
        summaryText.style.fontSize = '13px';
        summaryText.style.marginBottom = '15px';
        summaryText.textContent = summary;
        section.appendChild(summaryText);
        
        return section;
    }
    
    function buildExperience(experience) {
        const section = document.createElement('div');
        section.className = 'section';
        
        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = 'Experience';
        section.appendChild(title);
        
        if (experience && experience.length > 0) {
            experience.forEach(job => {
                const jobEl = document.createElement('div');
                jobEl.className = 'job';
                
                const company = document.createElement('p');
                company.className = 'company';
                company.textContent = job.company;
                jobEl.appendChild(company);
                
                const position = document.createElement('p');
                position.className = 'position';
                position.textContent = job.position;
                jobEl.appendChild(position);
                
                const period = document.createElement('p');
                period.className = 'period';
                period.textContent = job.period;
                jobEl.appendChild(period);
                
                if (job.duties && job.duties.length > 0) {
                    const duties = document.createElement('ul');
                    duties.className = 'job-duties';
                    
                    job.duties.forEach(duty => {
                        const li = document.createElement('li');
                        li.textContent = duty;
                        duties.appendChild(li);
                    });
                    
                    jobEl.appendChild(duties);
                }
                
                section.appendChild(jobEl);
            });
        }
        
        return section;
    }
    
    function buildProjects(projects) {
        const section = document.createElement('div');
        section.className = 'section';
        
        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = 'Projects';
        section.appendChild(title);
        
        if (projects && projects.length > 0) {
            projects.forEach(project => {
                const projectEl = document.createElement('div');
                projectEl.className = 'project';
                
                const projectTitle = document.createElement('p');
                projectTitle.className = 'project-title';
                projectTitle.textContent = project.title;
                projectEl.appendChild(projectTitle);
                
                if (project.details && project.details.length > 0) {
                    const details = document.createElement('ul');
                    details.className = 'project-details';
                    
                    project.details.forEach(detail => {
                        const li = document.createElement('li');
                        li.textContent = detail;
                        details.appendChild(li);
                    });
                    
                    projectEl.appendChild(details);
                }
                
                section.appendChild(projectEl);
            });
        }
        
        return section;
    }
    </script>
    <script src="js/unlock-contact.js"></script>
</body>
</html>
