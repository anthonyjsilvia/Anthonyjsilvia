<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio - Anthony Silvia, UX Designer & Developer">
    <title>Portfolio | Anthony Silvia</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Header Component (will be injected via JS) -->
    <header id="main-header"></header>
    
    <!-- Main Content -->
    <div class="page-container">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <span class="page-subtitle"><i class="fas fa-grip-vertical"></i> Portfolio</span>
                <h1 class="page-title">Featured <span class="highlight">Projects</span></h1>
                <p class="page-description">
                    A showcase of my best design and development work.
                </p>
            </div>
            
            <!-- Portfolio Filters -->
            <div class="portfolio-filters-container"></div>
            
            <!-- Portfolio Grid -->
            <div class="portfolio-container">
                <!-- Projects will be dynamically inserted here -->
            </div>
        </div>
    </div>
    
    <!-- Footer (will be populated by footer.js) -->
    <footer></footer>

    <!-- Custom JavaScript -->
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/portfolio.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
