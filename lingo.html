<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lingo - Accessibility App for Speech-to-Text and Text-to-Speech by Anthony Silvia">
    <title>Lingo | Anthony Silvia</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* App-specific styles */
        .app-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }
        
        .app-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        
        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .app-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        
        .app-info p {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        /* Styling for the loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
            z-index: 9999;
        }
        
        .loader-logo {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        
        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .loader-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 15px;
            color: var(--primary-color, #3f51b5);
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--primary-color, #3f51b5);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .loader {
                background-color: #121212;
            }
            
            .loader-text {
                color: #a8b4ff;
            }
            
            .loader-spinner {
                border-color: rgba(255, 255, 255, 0.1);
                border-top-color: #a8b4ff;
            }
        }
    </style>
    
    <!-- Redirect script -->
    <script>
        // Set a timeout for the redirect to allow the loading animation to be visible
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "https://NodeDa.com/lingo";
            }, 2000); // Redirect after 2 seconds
        };
    </script>
</head>
<body>
    <!-- Loading Indicator with Logo -->
    <div class="loader">
        <div class="loader-logo">
            <img src="https://nodeda.com/appicons/lingo.svg" alt="Lingo App Logo">
        </div>
        <div class="loader-spinner"></div>
        <div class="loader-text">Redirecting to Lingo...</div>
    </div>

    <!-- Rest of the page content (will only be visible briefly) -->
    <header id="main-header"></header>
    
    <div class="page-container">
        <div class="container">
            <div class="page-header">
                <span class="page-subtitle"><i class="fas fa-universal-access"></i> Accessibility App</span>
                <h1 class="page-title">Lingo - <span class="highlight">Breaking Communication Barriers</span></h1>
            </div>
        </div>
    </div>
    
    <footer></footer>
</body>
</html>
