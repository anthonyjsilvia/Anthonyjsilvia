<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <!-- Phone frame -->
  <rect width="375" height="812" rx="40" fill="#f5f5f5"/>
  <rect x="20" y="20" width="335" height="772" rx="30" fill="white"/>
  
  <!-- Status bar -->
  <rect x="40" y="40" width="295" height="30" rx="5" fill="#f0f0f0"/>
  <circle cx="60" cy="55" r="5" fill="#333"/>
  <rect x="80" y="50" width="100" height="10" rx="5" fill="#333"/>
  <circle cx="320" cy="55" r="5" fill="#333"/>
  
  <!-- Lesson header -->
  <rect x="40" y="90" width="295" height="60" rx="10" fill="#3498db"/>
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Basic Conversations</text>
  
  <!-- Progress indicator -->
  <rect x="40" y="170" width="295" height="30" rx="15" fill="#f0f0f0"/>
  <rect x="40" y="170" width="200" height="30" rx="15" fill="#3498db"/>
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="14" fill="white">Lesson 3 of 5</text>
  
  <!-- Lesson content -->
  <rect x="40" y="220" width="295" height="200" rx="10" fill="#f0f0f0"/>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="18" fill="#333">Translate to Spanish:</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">"Hello, how are you?"</text>
  
  <!-- Answer options -->
  <rect x="40" y="440" width="295" height="50" rx="10" fill="#f0f0f0"/>
  <text x="60" y="470" font-family="Arial, sans-serif" font-size="16" fill="#333">¡Hola, ¿cómo estás?</text>
  
  <rect x="40" y="500" width="295" height="50" rx="10" fill="#f0f0f0"/>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="16" fill="#333">Buenos días, ¿qué tal?</text>
  
  <rect x="40" y="560" width="295" height="50" rx="10" fill="#3498db"/>
  <text x="60" y="590" font-family="Arial, sans-serif" font-size="16" fill="white">Hola, ¿cómo estás?</text>
  
  <rect x="40" y="620" width="295" height="50" rx="10" fill="#f0f0f0"/>
  <text x="60" y="650" font-family="Arial, sans-serif" font-size="16" fill="#333">¿Qué hora es?</text>
  
  <!-- Navigation buttons -->
  <rect x="40" y="690" width="140" height="50" rx="10" fill="#f0f0f0"/>
  <text x="90" y="720" font-family="Arial, sans-serif" font-size="16" fill="#333">Previous</text>
  
  <rect x="195" y="690" width="140" height="50" rx="10" fill="#3498db"/>
  <text x="240" y="720" font-family="Arial, sans-serif" font-size="16" fill="white">Next</text>
</svg> 