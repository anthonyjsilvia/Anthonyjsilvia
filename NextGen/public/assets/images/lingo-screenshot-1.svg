<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <!-- Phone frame -->
  <rect width="375" height="812" rx="40" fill="#f5f5f5"/>
  <rect x="20" y="20" width="335" height="772" rx="30" fill="white"/>
  
  <!-- Status bar -->
  <rect x="40" y="40" width="295" height="30" rx="5" fill="#f0f0f0"/>
  <circle cx="60" cy="55" r="5" fill="#333"/>
  <rect x="80" y="50" width="100" height="10" rx="5" fill="#333"/>
  <circle cx="320" cy="55" r="5" fill="#333"/>
  
  <!-- App header -->
  <rect x="40" y="90" width="295" height="60" rx="10" fill="#3498db"/>
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Lingo</text>
  
  <!-- Language selection -->
  <rect x="40" y="170" width="295" height="100" rx="10" fill="#f0f0f0"/>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="18" fill="#333">Select Language</text>
  
  <!-- Language options -->
  <rect x="60" y="220" width="80" height="30" rx="15" fill="#3498db"/>
  <text x="85" y="240" font-family="Arial, sans-serif" font-size="14" fill="white">Spanish</text>
  
  <rect x="150" y="220" width="80" height="30" rx="15" fill="#f0f0f0"/>
  <text x="170" y="240" font-family="Arial, sans-serif" font-size="14" fill="#333">French</text>
  
  <rect x="240" y="220" width="80" height="30" rx="15" fill="#f0f0f0"/>
  <text x="255" y="240" font-family="Arial, sans-serif" font-size="14" fill="#333">German</text>
  
  <!-- Daily goal -->
  <rect x="40" y="290" width="295" height="120" rx="10" fill="#f0f0f0"/>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="18" fill="#333">Daily Goal</text>
  
  <!-- Progress bar -->
  <rect x="60" y="340" width="255" height="20" rx="10" fill="#e0e0e0"/>
  <rect x="60" y="340" width="180" height="20" rx="10" fill="#3498db"/>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="14" fill="#333">15/20 minutes completed</text>
  
  <!-- Lesson cards -->
  <rect x="40" y="430" width="295" height="100" rx="10" fill="#f0f0f0"/>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="18" fill="#333">Today's Lesson</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="14" fill="#666">Basic Conversations</text>
  
  <rect x="40" y="550" width="295" height="100" rx="10" fill="#f0f0f0"/>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="18" fill="#333">Practice</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="14" fill="#666">Speaking Exercises</text>
  
  <!-- Bottom navigation -->
  <rect x="0" y="742" width="375" height="70" fill="#f0f0f0"/>
  <circle cx="75" cy="777" r="20" fill="#3498db"/>
  <circle cx="187.5" cy="777" r="20" fill="#e0e0e0"/>
  <circle cx="300" cy="777" r="20" fill="#e0e0e0"/>
</svg> 